name: Daily WhatsApp Alerts

on:
  schedule:
    # Runs at 9:00 AM IST (3:30 AM UTC)
    - cron: '30 3 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm install @supabase/supabase-js dotenv
      
      - name: Send WhatsApp Notifications
        run: node scripts/send-notifications.js
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_KEY }}
          META_WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          META_WHATSAPP_PHONE_ID: ${{ secrets.WHATSAPP_PHONE_ID }}
          # Set to 'true' to force send all notifications (for testing)
          FORCE_SEND_ALL: 'false'